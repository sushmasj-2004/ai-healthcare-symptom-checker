<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI HealthCare - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4a90e2;
            --primary-dark: #2c6fc9;
            --secondary: #27ae60;
            --accent: #e74c3c;
            --bg: #f0f4ff;
            --card: #ffffff;
            --text: #2d3748;
            --muted: #718096;
            --border: #e2e8f0;
            --shadow: 0 10px 40px rgba(74, 144, 226, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(74, 144, 226, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(39, 174, 96, 0.1) 0%, transparent 50%);
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-logo i {
            font-size: 2.5rem;
            color: var(--primary);
            background: white;
            padding: 16px;
            border-radius: 50%;
            box-shadow: var(--shadow);
        }

        .auth-logo h1 {
            font-family: 'Nunito', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text);
            margin-top: 12px;
        }

        .auth-logo p {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .auth-card {
            background: var(--card);
            border-radius: 24px;
            padding: 32px;
            box-shadow: var(--shadow);
        }

        .tab-switcher {
            display: flex;
            background: var(--bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.85rem;
        }

        .input-wrap input,
        .input-wrap select {
            width: 100%;
            padding: 11px 14px 11px 38px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            color: var(--text);
            background: white;
            transition: border 0.2s;
            outline: none;
            appearance: none;
        }

        .input-wrap input:focus,
        .input-wrap select:focus {
            border-color: var(--primary);
        }

        .input-wrap input::placeholder {
            color: #b0bec5;
        }

        .gender-group {
            display: flex;
            gap: 8px;
        }

        .gender-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .gender-btn.active {
            border-color: var(--primary);
            background: #eef4ff;
            color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4);
        }

        .divider {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            margin: 16px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 38%;
            height: 1px;
            background: var(--border);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .guest-btn {
            width: 100%;
            padding: 12px;
            background: white;
            color: var(--muted);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .guest-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--accent);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            margin-bottom: 14px;
            display: none;
        }

        .success-msg {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: var(--secondary);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            margin-bottom: 14px;
            display: none;
        }

        .location-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 5px 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .pass-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-logo">
            <i class="fas fa-heartbeat"></i>
            <h1>AI HealthCare</h1>
            <p>Your AI-Powered Health Companion</p>
        </div>

        <div class="auth-card">
            <div class="tab-switcher">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>

            <!-- LOGIN -->
            <div class="form-section active" id="loginSection">
                <div class="error-msg" id="loginError"></div>
                <div class="success-msg" id="loginSuccess"></div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="your@email.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Enter password">
                        <button class="pass-toggle" onclick="togglePass('loginPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button class="submit-btn" onclick="handleLogin()">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>

                <div class="divider">or</div>
                <button class="guest-btn" onclick="continueAsGuest()">
                    <i class="fas fa-user"></i> Continue as Guest
                </button>
            </div>

            <!-- REGISTER -->
            <div class="form-section" id="registerSection">
                <div class="error-msg" id="registerError"></div>
                <div class="success-msg" id="registerSuccess"></div>

                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <div class="input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" id="regFirstName" placeholder="John">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <div class="input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" id="regLastName" placeholder="Doe">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="your@email.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Contact Number</label>
                        <div class="input-wrap">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="regPhone" placeholder="+91 XXXXX XXXXX">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Age</label>
                        <div class="input-wrap">
                            <i class="fas fa-birthday-cake"></i>
                            <input type="number" id="regAge" placeholder="25" min="1" max="120">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="gender-group">
                        <button class="gender-btn active" onclick="selectGender(this, 'male')">
                            <i class="fas fa-mars"></i> Male
                        </button>
                        <button class="gender-btn" onclick="selectGender(this, 'female')">
                            <i class="fas fa-venus"></i> Female
                        </button>
                        <button class="gender-btn" onclick="selectGender(this, 'other')">
                            <i class="fas fa-genderless"></i> Other
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <div class="input-wrap">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" id="regLocation" placeholder="City, State">
                        <button class="location-btn" onclick="getLocation()">
                            <i class="fas fa-crosshairs"></i> Detect
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="Min 6 characters">
                        <button class="pass-toggle" onclick="togglePass('regPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button class="submit-btn" onclick="handleRegister()">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </div>
        </div>
    </div>

    <script>
        let selectedGender = 'male';

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
            });
            document.getElementById('loginSection').classList.toggle('active', tab === 'login');
            document.getElementById('registerSection').classList.toggle('active', tab === 'register');
        }

        function selectGender(btn, gender) {
            document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedGender = gender;
        }

        function togglePass(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function showMsg(id, msg, isError = true) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 4000);
        }

        async function getDeviceInfo() {
            let ip = 'unknown';
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ip = data.ip;
            } catch (e) { }

            const deviceId = localStorage.getItem('deviceId') || (() => {
                const id = 'dev_' + Math.random().toString(36).substr(2, 12) + '_' + Date.now();
                localStorage.setItem('deviceId', id);
                return id;
            })();

            return {
                ip,
                deviceId,
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language
            };
        }

        async function getLocation() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(async pos => {
                try {
                    const { latitude, longitude } = pos.coords;
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`);
                    const data = await res.json();
                    const city = data.address.city || data.address.town || data.address.village || '';
                    const state = data.address.state || '';
                    document.getElementById('regLocation').value = `${city}, ${state}`;
                } catch (e) {
                    document.getElementById('regLocation').placeholder = 'Could not detect';
                }
            });
        }

        async function handleRegister() {
                // Check if device already has a registered user
                const deviceRegistered = localStorage.getItem('hc_device_registered');
                if (deviceRegistered) {
                    showMsg('registerError', `This device already has an account registered with ${deviceRegistered}. Please login instead.`);
                    setTimeout(() => switchTab('login'), 2000);
                    return;
                }

                const firstName = document.getElementById('regFirstName').value.trim();
                const lastName = document.getElementById('regLastName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const phone = document.getElementById('regPhone').value.trim();
                const age = document.getElementById('regAge').value.trim();
                const location = document.getElementById('regLocation').value.trim();
                const password = document.getElementById('regPassword').value;

                if (!firstName || !email || !phone || !password) {
                    showMsg('registerError', 'Please fill all required fields.');
                    return;
                }
                if (password.length < 6) {
                    showMsg('registerError', 'Password must be at least 6 characters.');
                    return;
                }

                const deviceInfo = await getDeviceInfo();

                const userData = {
                    firstName, lastName, email, phone, age,
                    gender: selectedGender, location, password,
                    deviceId: deviceInfo.deviceId,
                    ipAddress: deviceInfo.ip,
                    registeredAt: new Date().toISOString()
                };

                // Save to localStorage
                const users = JSON.parse(localStorage.getItem('hc_users') || '[]');
                if (users.find(u => u.email === email)) {
                    showMsg('registerError', 'Email already registered. Please login.');
                    return;
                }
                users.push(userData);
                localStorage.setItem('hc_users', JSON.stringify(users));

                // Mark this device as registered
                localStorage.setItem('hc_device_registered', email);

                // Save to CSV via backend
                await fetch('/api/save-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                document.getElementById('registerSuccess').textContent = 'Account created! Redirecting...';
                document.getElementById('registerSuccess').style.display = 'block';
                setTimeout(() => switchTab('login'), 1500);
            }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showMsg('loginError', 'Please enter email and password.');
                return;
            }

            const users = JSON.parse(localStorage.getItem('hc_users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                showMsg('loginError', 'Invalid email or password.');
                return;
            }

            const deviceInfo = await getDeviceInfo();
            const sessionUser = {
                ...user,
                sessionStart: new Date().toISOString(),
                currentIp: deviceInfo.ip,
                currentDeviceId: deviceInfo.deviceId
            };

            sessionStorage.setItem('hc_current_user', JSON.stringify(sessionUser));
            window.location.href = '/';
        }

        function continueAsGuest() {
            const guest = {
                firstName: 'Guest',
                email: 'guest@healthchecker.ai',
                isGuest: true,
                sessionStart: new Date().toISOString()
            };
            sessionStorage.setItem('hc_current_user', JSON.stringify(guest));
            window.location.href = '/';
        }

        // Auto-detect location on register tab
        document.querySelector('.tab-btn:last-child').addEventListener('click', () => {
            setTimeout(getLocation, 500);
        });
    </script>
</body>

</html>
